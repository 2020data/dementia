<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>01. 專有名詞詞庫｜失智症知識典藏平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="styles/editorial.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <div id="site-navbar"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-10">
    <div class="pb-5 mb-8 hairline-b flex flex-wrap items-end justify-between gap-4">
      <div>
        <p class="font-mono-index text-xs text-[#F37021]">01. [GLOSSARY ARCHIVE]</p>
        <h1 class="font-serif-editorial text-3xl text-[#1C1917] mt-1">失智症專有名詞詞庫</h1>
      </div>
      <p id="glossary-count" class="font-mono-index text-xs text-[#6B5E54]">LOADING...</p>
    </div>

    <!-- 五大分類按鈕列 -->
    <div id="glossary-cats" class="flex flex-wrap gap-2 mb-5"></div>

    <!-- 搜尋列 + A-Z 索引 -->
    <div id="glossary-filter" class="mb-4"></div>
    <div id="glossary-az" class="flex flex-wrap gap-1 mb-8 font-mono-index text-xs"></div>

    <!-- 詞條卡片列表 -->
    <div id="glossary-list" class="grid md:grid-cols-2 gap-5"></div>

    <!-- 分頁控制 -->
    <div id="glossary-pagination" class="mt-8 flex items-center justify-center gap-3"></div>
  </main>

  <div id="site-footer"></div>

  <script type="module">
    import { APP_CONFIG } from "./config/app.config.js";
    import { TAXONOMY, getCategoryById } from "./config/taxonomy.config.js";
    import { mountNavbar } from "./components/navbar.js";
    import { mountFooter } from "./components/footer.js";
    import { mountFilterBar } from "./components/filter-bar.js";
    import { fetchGlossaryTerms } from "./modules/glossary.module.js";
    import { renderMarkdown } from "./modules/parser.module.js";
    import { escapeHTML } from "./modules/sanitizer.module.js";

    const state = { categoryId: "ALL", search: "", letter: "ALL", page: 1 };
    const pageSize = APP_CONFIG.PAGINATION.GLOSSARY_PAGE_SIZE;

    // 渲染五大分類按鈕
    const catEl = document.getElementById("glossary-cats");
    catEl.innerHTML = [
      `<button type="button" data-cat="ALL" class="cat-pill active px-3.5 py-2 text-xs">全部大類</button>`,
      ...TAXONOMY.glossary.map(
        (c) => `<button type="button" data-cat="${c.id}" style="--btn-accent:${c.accentColor}" class="cat-pill px-3.5 py-2 text-xs">
          <span class="font-mono-index mr-1">${c.code}</span>${c.label}
        </button>`
      )
    ].join("");

    catEl.querySelectorAll("[data-cat]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.categoryId = btn.dataset.cat;
        state.page = 1;
        catEl.querySelectorAll("[data-cat]").forEach((b) => b.classList.toggle("active", b === btn));
        loadTerms();
      });
    });

    // A-Z 索引
    const azEl = document.getElementById("glossary-az");
    const letters = ["ALL", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")];
    azEl.innerHTML = letters
      .map((l) => `<button type="button" data-letter="${l}" class="px-2 py-1 border border-[#E5DDD5] bg-white hover:border-[#4A3728] ${l === "ALL" ? "bg-[#4A3728] text-white" : "text-[#6B5E54]"}">${l}</button>`)
      .join("");
    azEl.querySelectorAll("[data-letter]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.letter = btn.dataset.letter;
        state.page = 1;
        azEl.querySelectorAll("[data-letter]").forEach((b) => {
          const active = b === btn;
          b.className = `px-2 py-1 border border-[#E5DDD5] ${active ? "bg-[#4A3728] text-white" : "bg-white text-[#6B5E54] hover:border-[#4A3728]"}`;
        });
        loadTerms();
      });
    });

    mountFilterBar(document.getElementById("glossary-filter"), {
      placeholder: "搜尋中文詞條、英文全名或縮寫（如 MMSE、日落症候群）...",
      onChange: ({ search }) => {
        state.search = search;
        state.page = 1;
        loadTerms();
      }
    });

    async function loadTerms() {
      const listEl = document.getElementById("glossary-list");
      const countEl = document.getElementById("glossary-count");
      const pagEl = document.getElementById("glossary-pagination");
      listEl.innerHTML = `<p class="text-sm text-[#6B5E54]">載入詞庫中...</p>`;

      try {
        const { data, total, isDemo } = await fetchGlossaryTerms({ ...state, pageSize });
        countEl.textContent = `TOTAL ${total} TERMS ${isDemo ? "(DEMO DATA)" : ""}`;

        if (!data.length) {
          listEl.innerHTML = `<div class="col-span-full hairline-box p-8 text-center text-sm text-[#6B5E54]">查無符合條件的專有名詞。</div>`;
          pagEl.innerHTML = "";
          return;
        }

        listEl.innerHTML = data
          .map((item) => {
            const cat = getCategoryById("glossary", item.category_id);
            const related = Array.isArray(item.related_terms) ? item.related_terms : [];
            return `
            <article class="hairline-box p-6 bg-white">
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="font-mono-index text-[11px] px-2 py-0.5 text-white" style="background:${cat?.accentColor || "#4A3728"}">${cat?.code || item.category_id} · ${escapeHTML(item.subcategory || cat?.label || "")}</span>
                ${item.acronym ? `<span class="font-mono-index text-xs text-[#F37021]">${escapeHTML(item.acronym)}</span>` : ""}
              </div>
              <h2 class="font-serif-editorial text-xl text-[#1C1917]">${escapeHTML(item.term_zh)}</h2>
              <p class="font-mono-index text-xs text-[#6B5E54] mb-3">${escapeHTML(item.term_en || "")}</p>
              <p class="text-sm text-[#2E2925] leading-relaxed mb-4">${escapeHTML(item.summary || "")}</p>

              <details class="saddle-stitch bg-[#FDFBF7] p-4">
                <summary class="cursor-pointer font-mono-index text-xs text-[#4A3728] select-none">展開完整白話詳解與公式 ▾</summary>
                <div class="editorial-prose text-sm mt-4 pt-3 hairline-t">${renderMarkdown(item.detail_md || item.summary || "")}</div>
                ${
                  related.length
                    ? `<div class="mt-4 pt-3 hairline-t flex flex-wrap gap-1.5 items-center">
                         <span class="font-mono-index text-[11px] text-[#6B5E54] mr-1">相關詞條：</span>
                         ${related.map((r) => `<span class="px-2 py-0.5 text-xs bg-[#EFEAE2] text-[#4A3728]">${escapeHTML(r)}</span>`).join("")}
                       </div>`
                    : ""
                }
              </details>
            </article>
          `;
          })
          .join("");

        const totalPages = Math.max(1, Math.ceil(total / pageSize));
        pagEl.innerHTML =
          totalPages > 1
            ? `<button type="button" id="pg-prev" class="btn-editorial px-4 py-1.5 text-xs" ${state.page <= 1 ? "disabled" : ""}>上一頁</button>
               <span class="font-mono-index text-xs text-[#6B5E54]">PAGE ${state.page} / ${totalPages}</span>
               <button type="button" id="pg-next" class="btn-editorial px-4 py-1.5 text-xs" ${state.page >= totalPages ? "disabled" : ""}>下一頁</button>`
            : "";

        document.getElementById("pg-prev")?.addEventListener("click", () => {
          state.page -= 1;
          loadTerms();
        });
        document.getElementById("pg-next")?.addEventListener("click", () => {
          state.page += 1;
          loadTerms();
        });
      } catch (err) {
        listEl.innerHTML = `<div class="col-span-full p-6 border border-red-300 bg-red-50 text-sm text-red-800">讀取失敗：${escapeHTML(err.message)}</div>`;
      }
    }

    mountNavbar();
    mountFooter();
    loadTerms();
  </script>
</body>
</html>
